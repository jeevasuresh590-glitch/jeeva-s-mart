<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Products | JeevaMart — Smart Shopping. Simple. Secure.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Top Bar -->
  <div class="demo-banner">
    <div class="demo-banner-left">
      <span class="demo-banner-badge">B.Tech IT Project</span>
      <span>JeevaMart Dynamic Product Catalog</span>
    </div>
    <div class="demo-banner-links">
      <a href="index.html" class="demo-chip">Home</a>
      <a href="cart.html" class="demo-chip">Go to Cart</a>
    </div>
  </div>

  <!-- Primary Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        JeevaMart<span class="brand-accent">.</span>
      </a>

      <!-- Search Input Group -->
      <div class="search-bar-container">
        <div class="search-input-group">
          <input
            type="text"
            id="productSearchInput"
            class="search-input"
            placeholder="Search products by name, brand, or specifications..."
            oninput="handleLiveSearch()"
          />
          <button type="button" class="search-btn" onclick="applyFilters()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="nav-actions">
        <a href="orders.html" class="nav-btn">
          <span>📦</span> Orders
        </a>
        <a href="cart.html" class="nav-btn" style="position: relative;">
          <span>🛒</span> Cart
          <span id="navCartCount" class="cart-badge" style="display:none;">0</span>
        </a>
        <div id="navAuthArea">
          <a href="login.html" class="nav-btn nav-btn-primary">Login</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Category Nav Bar -->
  <nav class="category-nav">
    <div class="category-nav-container">
      <button class="cat-link active" onclick="selectNavCategory('All', this)"><span>🛍️</span> All Categories</button>
      <button class="cat-link" onclick="selectNavCategory('Electronics', this)"><span>🎧</span> Electronics</button>
      <button class="cat-link" onclick="selectNavCategory('Mobiles', this)"><span>📱</span> Mobiles</button>
      <button class="cat-link" onclick="selectNavCategory('Laptops', this)"><span>💻</span> Laptops</button>
      <button class="cat-link" onclick="selectNavCategory('Fashion', this)"><span>👔</span> Fashion</button>
      <button class="cat-link" onclick="selectNavCategory('Home', this)"><span>🏠</span> Home & Kitchen</button>
      <button class="cat-link" onclick="selectNavCategory('Beauty', this)"><span>✨</span> Beauty</button>
      <button class="cat-link" onclick="selectNavCategory('Grocery', this)"><span>🍚</span> Grocery</button>
      <button class="cat-link" onclick="selectNavCategory('Accessories', this)"><span>🔌</span> Accessories</button>
    </div>
  </nav>

  <!-- Main Catalog Area with Sidebar Filters -->
  <main class="main-content">
    <div class="catalog-layout">

      <!-- Filter Sidebar -->
      <aside class="filter-sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;">
          <h3 style="font-size: 16px; font-weight: 700;">Filters</h3>
          <button onclick="resetFilters()" style="background: none; border: none; font-size: 12px; color: var(--primary); font-weight: 600; cursor: pointer;">Clear All</button>
        </div>

        <!-- Category Radio Filter -->
        <div class="filter-group">
          <div class="filter-title">Category</div>
          <div id="categoryFilterContainer">
            <label class="filter-option"><input type="radio" name="catFilter" value="All" checked onchange="applyFilters()" /> All Categories</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Electronics" onchange="applyFilters()" /> Electronics</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Mobiles" onchange="applyFilters()" /> Mobiles</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Laptops" onchange="applyFilters()" /> Laptops</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Fashion" onchange="applyFilters()" /> Fashion</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Home" onchange="applyFilters()" /> Home & Kitchen</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Beauty" onchange="applyFilters()" /> Beauty</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Grocery" onchange="applyFilters()" /> Grocery</label>
            <label class="filter-option"><input type="radio" name="catFilter" value="Accessories" onchange="applyFilters()" /> Accessories</label>
          </div>
        </div>

        <!-- Price Range Filter -->
        <div class="filter-group">
          <div class="filter-title">Price Range</div>
          <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="number" id="minPriceInput" class="form-input" placeholder="Min ₹" style="padding: 6px 8px; font-size: 12px;" onchange="applyFilters()" />
            <input type="number" id="maxPriceInput" class="form-input" placeholder="Max ₹" style="padding: 6px 8px; font-size: 12px;" onchange="applyFilters()" />
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label class="filter-option"><input type="radio" name="pricePreset" value="all" checked onchange="setPricePreset(0, 0)" /> Any Price</label>
            <label class="filter-option"><input type="radio" name="pricePreset" value="under1k" onchange="setPricePreset(0, 1000)" /> Under ₹1,000</label>
            <label class="filter-option"><input type="radio" name="pricePreset" value="1k-5k" onchange="setPricePreset(1000, 5000)" /> ₹1,000 – ₹5,000</label>
            <label class="filter-option"><input type="radio" name="pricePreset" value="5k-25k" onchange="setPricePreset(5000, 25000)" /> ₹5,000 – ₹25,000</label>
            <label class="filter-option"><input type="radio" name="pricePreset" value="above25k" onchange="setPricePreset(25000, 200000)" /> Above ₹25,000</label>
          </div>
        </div>

        <!-- Customer Rating Filter -->
        <div class="filter-group">
          <div class="filter-title">Customer Ratings</div>
          <label class="filter-option"><input type="radio" name="ratingFilter" value="0" checked onchange="applyFilters()" /> All Ratings</label>
          <label class="filter-option"><input type="radio" name="ratingFilter" value="4" onchange="applyFilters()" /> 4★ & above</label>
          <label class="filter-option"><input type="radio" name="ratingFilter" value="3" onchange="applyFilters()" /> 3★ & above</label>
        </div>

        <!-- Availability Filter -->
        <div class="filter-group">
          <div class="filter-title">Availability</div>
          <label class="filter-option"><input type="checkbox" id="inStockCheckbox" onchange="applyFilters()" /> Exclude Out of Stock</label>
        </div>

        <!-- Discount Filter -->
        <div class="filter-group">
          <div class="filter-title">Discount</div>
          <label class="filter-option"><input type="radio" name="discountFilter" value="0" checked onchange="applyFilters()" /> All Discounts</label>
          <label class="filter-option"><input type="radio" name="discountFilter" value="10" onchange="applyFilters()" /> 10% or more</label>
          <label class="filter-option"><input type="radio" name="discountFilter" value="20" onchange="applyFilters()" /> 20% or more</label>
          <label class="filter-option"><input type="radio" name="discountFilter" value="30" onchange="applyFilters()" /> 30% or more</label>
          <label class="filter-option"><input type="radio" name="discountFilter" value="40" onchange="applyFilters()" /> 40% or more</label>
        </div>
      </aside>

      <!-- Main Products View -->
      <section>
        <!-- Sort and Stats Header -->
        <div class="sort-bar">
          <div>
            <span style="font-size: 14px; font-weight: 700;" id="catalogResultsCount">Loading products...</span>
          </div>
          <div class="sort-options">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Sort By:</span>
            <button class="sort-tab active" data-sort="newest" onclick="changeSort('newest', this)">Newest</button>
            <button class="sort-tab" data-sort="price_asc" onclick="changeSort('price_asc', this)">Price: Low to High</button>
            <button class="sort-tab" data-sort="price_desc" onclick="changeSort('price_desc', this)">Price: High to Low</button>
            <button class="sort-tab" data-sort="rating" onclick="changeSort('rating', this)">Popularity / Rating</button>
          </div>
        </div>

        <!-- Products Grid Container -->
        <div id="catalogProductsGrid" class="product-grid">
          <!-- Dynamically populated -->
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <div>© 2026 JeevaMart. All rights reserved. B.Tech IT Engineering Major Project.</div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    let allProducts = [];
    let currentSort = 'newest';

    async function loadCatalog() {
      try {
        const res = await apiRequest('/products');
        if (res.success && res.data) {
          allProducts = res.data;

          // Parse URL parameters (e.g. ?category=Electronics or ?search=laptop)
          const params = new URLSearchParams(window.location.search);
          const searchParam = params.get('search');
          const catParam = params.get('category');

          if (searchParam) {
            document.getElementById('productSearchInput').value = searchParam;
          }
          if (catParam) {
            const radio = document.querySelector(`input[name="catFilter"][value="${catParam}"]`);
            if (radio) radio.checked = true;

            // Highlight category nav link
            document.querySelectorAll('.category-nav .cat-link').forEach(btn => {
              if (btn.textContent.includes(catParam)) {
                btn.classList.add('active');
              } else {
                btn.classList.remove('active');
              }
            });
          }

          applyFilters();
        }
      } catch (err) {
        console.error('Catalog load error:', err);
      }
    }

    function selectNavCategory(cat, el) {
      document.querySelectorAll('.category-nav .cat-link').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      const radio = document.querySelector(`input[name="catFilter"][value="${cat}"]`);
      if (radio) radio.checked = true;
      applyFilters();
    }

    function setPricePreset(min, max) {
      document.getElementById('minPriceInput').value = min > 0 ? min : '';
      document.getElementById('maxPriceInput').value = max > 0 ? max : '';
      applyFilters();
    }

    function changeSort(sortBy, el) {
      currentSort = sortBy;
      document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      applyFilters();
    }

    let searchTimeout = null;
    function handleLiveSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        applyFilters();
      }, 250);
    }

    function resetFilters() {
      document.getElementById('productSearchInput').value = '';
      document.querySelector('input[name="catFilter"][value="All"]').checked = true;
      document.querySelector('input[name="pricePreset"][value="all"]').checked = true;
      document.getElementById('minPriceInput').value = '';
      document.getElementById('maxPriceInput').value = '';
      document.querySelector('input[name="ratingFilter"][value="0"]').checked = true;
      document.querySelector('input[name="discountFilter"][value="0"]').checked = true;
      document.getElementById('inStockCheckbox').checked = false;
      document.querySelectorAll('.category-nav .cat-link').forEach(b => b.classList.remove('active'));
      document.querySelector('.category-nav .cat-link').classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('productSearchInput').value.trim().toLowerCase();
      const catRadio = document.querySelector('input[name="catFilter"]:checked');
      const selectedCat = catRadio ? catRadio.value : 'All';
      
      const minPrice = Number(document.getElementById('minPriceInput').value) || 0;
      const maxPrice = Number(document.getElementById('maxPriceInput').value) || 0;

      const ratingRadio = document.querySelector('input[name="ratingFilter"]:checked');
      const minRating = ratingRadio ? Number(ratingRadio.value) : 0;

      const discountRadio = document.querySelector('input[name="discountFilter"]:checked');
      const minDiscount = discountRadio ? Number(discountRadio.value) : 0;

      const inStockOnly = document.getElementById('inStockCheckbox').checked;

      let filtered = allProducts.filter(p => {
        // Search query check (name, description, category)
        if (q) {
          const matchName = (p.name || '').toLowerCase().includes(q);
          const matchDesc = (p.description || '').toLowerCase().includes(q);
          const matchCat = (p.category || '').toLowerCase().includes(q);
          if (!matchName && !matchDesc && !matchCat) return false;
        }

        // Category check
        if (selectedCat !== 'All' && p.category !== selectedCat) {
          return false;
        }

        // Price check (convert cents to rupees)
        const priceRupees = p.priceCents / 100;
        if (minPrice > 0 && priceRupees < minPrice) return false;
        if (maxPrice > 0 && priceRupees > maxPrice) return false;

        // Rating check
        if (minRating > 0 && (p.averageRating || 0) < minRating) return false;

        // Discount check
        if (minDiscount > 0 && (p.discountPercent || 0) < minDiscount) return false;

        // In-stock check
        if (inStockOnly && p.stockQty <= 0) return false;

        return true;
      });

      // Sorting
      if (currentSort === 'price_asc') {
        filtered.sort((a, b) => a.priceCents - b.priceCents);
      } else if (currentSort === 'price_desc') {
        filtered.sort((a, b) => b.priceCents - a.priceCents);
      } else if (currentSort === 'rating') {
        filtered.sort((a, b) => (b.averageRating || 0) - (a.averageRating || 0));
      } else {
        // Newest
        filtered.sort((a, b) => b.id - a.id);
      }

      // Render
      const grid = document.getElementById('catalogProductsGrid');
      const countEl = document.getElementById('catalogResultsCount');
      countEl.textContent = `Showing ${filtered.length} of ${allProducts.length} Products`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-icon">🔍</div>
            <h3 class="empty-title">No products found</h3>
            <p class="empty-desc">We couldn't find any products matching your search criteria. Try adjusting filters or search query.</p>
            <button class="btn-block-primary" style="display: inline-block; width: auto; padding: 10px 24px;" onclick="resetFilters()">Reset All Filters</button>
          </div>
        `;
      } else {
        grid.innerHTML = filtered.map(createProductCardHtml).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCatalog();
    });
  </script>
</body>
</html>
